name: Rebuild assets

# No schedule: nothing in assets/ depends on live data any more, so a nightly run
# could only ever produce an identical file. This exists to keep the committed SVGs
# in step with the renderers when those change.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/assets.yml'

permissions:
  contents: write

concurrency:
  group: assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Render assets
        run: node scripts/build.mjs

      - name: Commit if the output changed
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- assets; then
            echo 'No change.'
          else
            git add assets
            git commit -m 'chore: rebuild assets'
            git push
          fi
