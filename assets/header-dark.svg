<text x="34" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" letter-spacing="3.4" fill="#F0E9DE" class="role role2">AGENT &amp; LLM SYSTEMS</text>
