<text x="22" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" letter-spacing="3.4" fill="#1E1712" class="role role2">AGENT &amp; LLM SYSTEMS</text>
